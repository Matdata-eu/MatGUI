name: Deploy to Cloudflare Pages

# Every branch gets its own preview at https://<branch>.<project>.pages.dev,
# main is the production deployment. The Cloudflare Pages project is called
# matgui-doc (it serves matgui-doc.matdata.eu) and is created on the first run.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not available (not set yet, or a Dependabot run); skipping the Cloudflare Pages deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Disable AppArmor
        run: echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns

      - name: Build MatGUI
        run: npm run build
        env:
          PUBLIC_PATH: /dev/main/

      - name: Build documentation
        run: |
          cp -r docs/* website/docs/
          cd website
          npm ci
          npm run build

      - name: Prepare deployment directory
        run: |
          mkdir -p deployment/dev/main
          cp -r website/build/* deployment/
          cp -r build/* deployment/dev/main/

      - name: Project name
        id: project
        run: echo "name=matgui-doc" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # Create the project on the first run. The Cloudflare API sometimes fails
          # this call (code 8000000), so retry, and accept "already exists".
          preCommands: for i in 1 2 3; do out=$(npx wrangler pages project create ${{ steps.project.outputs.name }} --production-branch=main 2>&1) && break; echo "$out"; echo "$out" | grep -qi "already exists" && break; sleep 15; done
          command: pages deploy deployment --project-name=${{ steps.project.outputs.name }} --branch=${{ github.ref_name }} --commit-hash=${{ github.sha }} --commit-dirty=true

      - name: Preview URLs
        run: |
          echo "### Cloudflare Pages" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch alias: ${{ steps.deploy.outputs.pages-deployment-alias-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- This deployment: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
