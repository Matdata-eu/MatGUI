name: Refresh LOV terms

# Regenerates the bundled Linked Open Vocabularies term list (packages/yasqe/src/lov-terms.json)
# from the LOV dump and opens a pull request when it changed.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the LOV term list
        run: npm run util:fetchLov

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-lov-terms
          commit-message: "chore(yasqe): refresh the bundled LOV terms"
          title: "chore(yasqe): refresh the bundled LOV terms"
          body: Regenerated `packages/yasqe/src/lov-terms.json` from the LOV dump with `npm run util:fetchLov`.
          add-paths: packages/yasqe/src/lov-terms.json
