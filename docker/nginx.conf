# MatGUI static site. Replaces the default server of nginx-unprivileged (which listens on 8080).
server {
    listen       8080;
    listen       [::]:8080;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    # The bundle is about 5 MB of JavaScript; gzip brings the transfer down to about 1.5 MB
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fonts and images emitted by the build carry a content hash in their name
    location ~* "-[A-Z0-9]{8}\.(woff2?|ttf|eot|png|jpg|svg)$" {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # yasgui.min.js and .css keep their name across releases: let browsers revalidate them
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
